name: Api CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  api-build:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, windows-latest]
        
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repo
        uses: actions/Checkout@v4

      - name: Set up java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build project
        run: mvn clean package

      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: spring-jar
          path: backend/target/*.jar



